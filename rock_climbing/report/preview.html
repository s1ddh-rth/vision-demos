<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Climb Vision Judge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0f12; --bg2:#14171c; --card:#171b21; --card2:#1d222a; --line:#272d36; --line2:#323a45;
  --tx:#e9edf2; --tx2:#9aa4b1; --tx3:#66707d;
  --acc:#2fb8ff; --acc2:#1f7fff; --accg:rgba(47,184,255,.14);
  --ok:#35d07f; --warn:#ffb020; --bad:#ff4d5e;
  --okg:rgba(53,208,127,.14); --warng:rgba(255,176,32,.14); --badg:rgba(255,77,94,.14);
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --sans:"Space Grotesk",system-ui,-apple-system,Segoe UI,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1200px 500px at 80% -10%,rgba(31,127,255,.12),transparent 60%),var(--bg)}
a{color:var(--acc)}
.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 48px}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx3)}
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:14px;padding:18px}
.sec{margin-top:22px}
.sec-h{display:flex;align-items:baseline;gap:12px;margin:0 0 12px}
.sec-h h2{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em}
.sec-h .num{font-family:var(--mono);font-size:12px;color:var(--acc);border:1px solid var(--line2);border-radius:6px;padding:2px 7px}
.muted{color:var(--tx2)} .dim{color:var(--tx3)}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
/* top bar */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.02em}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc)}
.live{font-family:var(--mono);font-size:11px;color:var(--tx2);border:1px solid var(--line2);padding:4px 9px;border-radius:99px}
/* hero */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;align-items:stretch}
.hero h1{font-size:44px;line-height:1;margin:8px 0 10px;letter-spacing:-.03em}
.route-chip{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:13px;background:var(--card2);border:1px solid var(--line2);border-radius:99px;padding:5px 12px}
.route-chip i{width:12px;height:12px;border-radius:50%;display:inline-block}
.badge{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;border-radius:14px;padding:18px 22px;margin-top:16px;border:1px solid}
.badge .res{font-size:64px;font-weight:700;letter-spacing:-.03em;line-height:.95}
.badge.top{background:var(--okg);border-color:rgba(53,208,127,.45)} .badge.top .res{color:var(--ok)}
.badge.zone{background:var(--warng);border-color:rgba(255,176,32,.45)} .badge.zone .res{color:var(--warn)}
.badge.none{background:var(--badg);border-color:rgba(255,77,94,.45)} .badge.none .res{color:var(--bad)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat .v{font-family:var(--mono);font-size:34px;font-weight:700;letter-spacing:-.02em;margin-top:6px}
.stat .v small{font-size:14px;color:var(--tx2);font-weight:400;margin-left:3px}
/* video */
.vid-grid{display:grid;grid-template-columns:1fr;gap:12px}
.video-box{background:#000;border-radius:12px;overflow:hidden;border:1px solid var(--line);position:relative}
.video-box video{display:block;width:100%;max-height:620px;background:#000}
.noasset{padding:60px 20px;text-align:center;color:var(--tx3);font-family:var(--mono);font-size:13px}
.readout{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0 8px}
.readout .t{font-family:var(--mono);font-size:26px;font-weight:700}
.readout .t small{color:var(--tx3);font-size:14px;font-weight:400}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--tx2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.tl{position:relative;height:104px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;cursor:pointer;user-select:none;overflow:hidden}
.tl .lane{position:absolute;left:0;right:0;height:1px;background:var(--line)}
.tl .lbl{position:absolute;left:8px;font-family:var(--mono);font-size:9px;color:var(--tx3);letter-spacing:.1em;pointer-events:none}
.tl .prog{position:absolute;top:0;bottom:0;left:0;background:var(--accg);pointer-events:none}
.tl .head{position:absolute;top:0;bottom:0;width:2px;background:var(--acc);box-shadow:0 0 8px var(--acc);pointer-events:none}
.tick{position:absolute;transform:translateX(-50%);border-radius:2px;cursor:pointer;transition:transform .12s}
.tick:hover{transform:translateX(-50%) scaleY(1.25)}
.tick.ev{width:4px;height:22px;top:6px}
.tick.fall{width:12px;height:12px;top:36px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 3px var(--badg)}
.tick.fall.jump_off,.tick.fall.downclimb{background:var(--warn);box-shadow:0 0 0 3px var(--warng)}
.tick.foot{height:12px;top:64px;min-width:3px;opacity:.9}
.tick.foot.right{top:84px}
.tl-axis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--tx3);margin-top:4px}
.tip{position:fixed;z-index:50;pointer-events:none;background:#0b0d10;border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:12px;max-width:260px;display:none}
/* judge */
.sm{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:stretch;gap:10px}
.node{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:16px;position:relative}
.node.done{border-color:rgba(53,208,127,.5);box-shadow:inset 0 0 0 1px rgba(53,208,127,.12)}
.node.miss{opacity:.55}
.node .nm{font-size:22px;font-weight:700;letter-spacing:.04em}
.node .ck{position:absolute;top:14px;right:14px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700}
.node.done .ck{background:var(--ok);color:#06220f}
.node.miss .ck{background:var(--line2);color:var(--tx3)}
.node .tm{font-family:var(--mono);font-size:24px;margin-top:10px}
.node .sub{font-size:12px;color:var(--tx2);margin-top:4px}
.arrow{align-self:center;color:var(--tx3);font-family:var(--mono);font-size:20px}
.evlist{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.evlist li{display:flex;gap:12px;align-items:baseline;font-size:13px;padding:8px 10px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);cursor:pointer}
.evlist li:hover{border-color:var(--acc)}
.evlist .mono{color:var(--acc);min-width:58px}
/* safety */
.saf-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:start}
.falls{display:grid;gap:14px}
.fall{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:auto 1fr;gap:16px}
.fall-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.kind{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:6px;border:1px solid}
.kind.fall{color:var(--bad);border-color:rgba(255,77,94,.5);background:var(--badg)}
.kind.jump_off{color:var(--acc);border-color:rgba(47,184,255,.5);background:var(--accg)}
.kind.downclimb{color:var(--ok);border-color:rgba(53,208,127,.5);background:var(--okg)}
.seek{font-family:var(--mono);font-size:12px;color:var(--tx2);background:none;border:1px solid var(--line2);border-radius:6px;padding:3px 8px;cursor:pointer}
.seek:hover{color:var(--acc);border-color:var(--acc)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.m{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.m .k{font-size:10px;color:var(--tx3);font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase}
.m .v{font-family:var(--mono);font-size:17px;font-weight:600;margin-top:3px}
.flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.flag{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--warng);color:var(--warn);border:1px solid rgba(255,176,32,.35)}
.flag.none{background:var(--okg);color:var(--ok);border-color:rgba(53,208,127,.35)}
.quote{margin:12px 0 0;padding:10px 14px;border-left:3px solid var(--acc);background:var(--bg2);border-radius:0 8px 8px 0;font-size:14px;line-height:1.5;color:var(--tx)}
.quote .src{display:block;font-family:var(--mono);font-size:10px;color:var(--tx3);margin-top:6px;letter-spacing:.08em}
.kf{margin-top:12px;border-radius:10px;overflow:hidden;border:1px solid var(--line);max-width:100%}
.kf img{display:block;width:100%;max-height:260px;object-fit:contain;background:#000}
.ring-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.clean{padding:34px 20px;text-align:center;border:1px dashed rgba(53,208,127,.45);border-radius:14px;background:var(--okg)}
.clean .big{font-size:28px;font-weight:700;color:var(--ok)}
.map-card{position:sticky;top:12px}
.map{position:relative;border-radius:10px;overflow:hidden;background:#07090b;border:1px solid var(--line)}
.map img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;opacity:.8}
.map svg{position:relative;display:block;width:100%;height:auto}
/* feet */
.feet-top{display:grid;grid-template-columns:auto 1fr 1fr;gap:14px;align-items:stretch}
.grade{display:flex;align-items:center;gap:16px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:16px 20px}
.grade .g{font-size:72px;font-weight:700;line-height:1;letter-spacing:-.04em}
.grade .s{font-family:var(--mono);font-size:28px;font-weight:700}
.pf{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.pf .row{display:flex;justify-content:space-between;font-size:13px;color:var(--tx2);margin-top:6px}
.pf .row b{font-family:var(--mono);color:var(--tx)}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:99px}
table.pl{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px}
.pl th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);font-weight:400;padding:8px;border-bottom:1px solid var(--line)}
.pl td{padding:9px 8px;border-bottom:1px solid var(--line);font-family:var(--mono)}
.pl tr.r{cursor:pointer}
.pl tr.r:hover td{background:var(--bg2)}
.pl tr.worst td{background:rgba(255,77,94,.06)}
.pl tr.worst td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.foot-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.scell{display:flex;align-items:center;gap:8px;min-width:120px}
.scell .bar{flex:1}
.tag-w{font-size:9px;color:var(--bad);border:1px solid rgba(255,77,94,.5);border-radius:4px;padding:1px 4px;margin-left:6px;letter-spacing:.08em}
.tbl-wrap{overflow-x:auto}
/* dyno */
.dy-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.dy-grid{display:grid;grid-template-columns:1fr 1.25fr;gap:18px;align-items:start}
.dy-list{display:grid;gap:10px}
.dc{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:12px;transition:border-color .15s}
.dc:hover{border-color:var(--line2)}
.dc.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 0 18px rgba(47,184,255,.15)}
.dc .ttl{font-family:var(--mono);font-size:15px;font-weight:700}
.dc .sub{font-size:12px;color:var(--tx2);margin-top:3px}
.need{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:6px;border:1px solid currentColor;white-space:nowrap}
.need.static{color:var(--ok);background:var(--okg)} .need.deadpoint{color:var(--acc);background:var(--accg)}
.need.dyno{color:var(--warn);background:var(--warng)} .need.out_of_reach{color:var(--bad);background:var(--badg)}
.dbar{display:grid;grid-template-columns:62px 1fr 72px;align-items:center;gap:8px;font-size:11px;font-family:var(--mono);color:var(--tx2);margin-top:8px}
.dbar .bar{position:relative}
.dbar .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--tx3)}
.dc .thumb{width:96px;height:96px;border-radius:8px;overflow:hidden;background:#000;border:1px solid var(--line)}
.dc .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.vlm{margin-top:10px;font-size:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.vlm .q{flex-basis:100%;border-left:2px solid var(--acc);padding-left:10px;color:var(--tx);font-size:13px;line-height:1.45}
.dy-map-card{position:sticky;top:12px}
@media (max-width:900px){.dy-grid{grid-template-columns:1fr}.dy-map-card{position:static}}
@media (max-width:620px){.dy-stats{grid-template-columns:1fr 1fr}.dc{grid-template-columns:1fr}.dc .thumb{width:100%;height:160px}}
/* reward & rl */
.rw-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.rw-grid > div{min-width:0}
.chart{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:6px 6px 2px;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart.click{cursor:pointer}
.rw-total{display:flex;align-items:baseline;gap:10px;margin:16px 0 8px}
.rw-total .v{font-family:var(--mono);font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1}
.tb{display:grid;grid-template-columns:78px 1fr 58px;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--tx2);margin-top:5px}
.tb .trk{position:relative;height:12px;background:var(--bg2);border:1px solid var(--line);border-radius:4px}
.tb .trk .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--tx3)}
.tb .trk i{position:absolute;top:1px;bottom:1px;border-radius:3px}
.tb .w{color:var(--tx3);font-size:9px}
.rl-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.rl-stats .m .v{font-size:15px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;color:var(--tx2);font-family:var(--mono);font-size:12px;padding:5px 12px;cursor:pointer}
.seg button + button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--accg);color:var(--acc)}
.rl-map-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 8px}
@media (max-width:900px){.rw-grid{grid-template-columns:1fr}}
@media (max-width:620px){.rl-stats{grid-template-columns:1fr 1fr}.tb{grid-template-columns:66px 1fr 50px}.rw-total .v{font-size:36px}}
/* coach */
.coach{font-size:17px;line-height:1.6;border-left:3px solid var(--acc);padding:4px 0 4px 16px}
footer{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--tx3)}
@media (max-width:900px){
  .hero,.saf-grid{grid-template-columns:1fr}
  .map-card{position:static}
  .feet-top{grid-template-columns:1fr 1fr}
  .feet-top .grade{grid-column:1/-1}
}
@media (max-width:620px){
  .wrap{padding:16px 12px 36px}
  .hero h1{font-size:32px}
  .badge .res{font-size:48px}
  .stat .v{font-size:26px}
  .sm{grid-template-columns:1fr}
  .arrow{display:none}
  .fall{grid-template-columns:1fr}
  .metrics{grid-template-columns:repeat(2,1fr)}
  .feet-top{grid-template-columns:1fr}
  .pl .hide-sm{display:none}
}
</style>
</head>

<div class="wrap" id="app"></div>
<div class="tip" id="tip"></div>

</section>`;
function rlSvg(mode){
  const P = pt => `${pt[0].toFixed(4)},${(pt[1]*AR).toFixed(4)}`;
  let s = `<svg viewBox="0 0 1 ${AR.toFixed(4)}" preserveAspectRatio="none"><defs>` +
    Object.entries(WHO_COL).map(([k,c]) => `<marker id="rl-ah-${k}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${c}"/></marker>`).join('') + `</defs>`;
  (D.holds||[]).forEach(h => {
    if (h.polygon && h.polygon.length > 2) s += `<polygon points="${h.polygon.map(P).join(' ')}" fill="rgba(47,184,255,.08)" stroke="rgba(47,184,255,.35)" stroke-width="0.002"/>`;
    if (h.centroid_xy) { const [x,y] = h.centroid_xy; s += `<circle cx="${x}" cy="${y*AR}" r="0.008" fill="${rc}" stroke="#fff" stroke-width="0.002"/><text x="${x+0.013}" y="${y*AR+0.006}" font-size="0.022" fill="#cfe8ff" font-family="JetBrains Mono,monospace">${esc(h.id)}</text>`; }
  });
  const whos = mode === 'both' ? ['human','agent'] : [mode];
  let labels = '';
  whos.forEach(who => {
    const col = WHO_COL[who], off = mode === 'both' ? (who === 'human' ? 0.008 : -0.008) : 0, seen = {};
    rlBeta[who].forEach((m, i) => {
      const a = holdById[m.from], b = holdById[m.to]; if (!b || !b.centroid_xy) return;
      const n = i + 1, tipTxt = `${who==='human'?'You':'Agent'} · move ${n} · ${m.hand||'?'} hand #${m.from}→#${m.to} · ${String(m.needed||'?').replace(/_/g,' ')} · r ${sgn(m.reward)}`;
      const [x2,y2] = b.centroid_xy;
      if (!a || !a.centroid_xy || m.from === m.to) {
        const r = 0.022 + (who === 'agent' ? 0.008 : 0);
        s += `<circle cx="${x2}" cy="${y2*AR}" r="${r}" fill="none" stroke="${col}" stroke-width="0.004" data-tip="${esc(tipTxt)}"/>`;
        labels += `<g data-tip="${esc(tipTxt)}"><circle cx="${x2+r}" cy="${y2*AR-r}" r="0.016" fill="#0b0d10" stroke="${col}" stroke-width="0.003"/><text x="${x2+r}" y="${y2*AR-r+0.0065}" text-anchor="middle" font-size="0.018" font-weight="700" fill="${col}" font-family="JetBrains Mono,monospace">${n}</text></g>`;
        return;
      }
      const [x1,y1] = a.centroid_xy; const X1 = x1, Y1 = y1*AR, X2 = x2, Y2 = y2*AR;
      const L = Math.hypot(X2-X1, Y2-Y1) || 1, ux = (X2-X1)/L, uy = (Y2-Y1)/L, nx = -uy*off, ny = ux*off, sh = 0.016;
      const k = NEED_DASH[m.needed] != null ? m.needed : 'dyno', dash = NEED_DASH[k];
      s += `<line x1="${X1+ux*sh+nx}" y1="${Y1+uy*sh+ny}" x2="${X2-ux*sh+nx}" y2="${Y2-uy*sh+ny}" stroke="${col}" stroke-width="0.005" stroke-opacity=".9" ${dash?`stroke-dasharray="${dash}"`:''} stroke-linecap="round" marker-end="url(#rl-ah-${who})" data-tip="${esc(tipTxt)}"/>`;
      const key = m.from + '-' + m.to; seen[key] = (seen[key] || 0) + 1;
      const f = 0.5 + (seen[key]-1)*0.16 * (who === 'human' ? 1 : -1), lx = X1+(X2-X1)*f+nx*2.2, ly = Y1+(Y2-Y1)*f+ny*2.2;
      labels += `<g data-tip="${esc(tipTxt)}"><circle cx="${lx}" cy="${ly}" r="0.016" fill="#0b0d10" stroke="${col}" stroke-width="0.003"/><text x="${lx}" y="${ly+0.0065}" text-anchor="middle" font-size="0.018" font-weight="700" fill="${col}" font-family="JetBrains Mono,monospace">${n}</text></g>`;
    });
  });
  return s + labels + '</svg>';
}
// pixel-sized line chart (re-rendered on resize so text stays legible on phones)
function lineChart(el, pts, o){
  const Wp = Math.max(260, el.clientWidth - 12), Hp = o.h || Math.round(Math.max(150, Math.min(220, Wp*0.42)));
  const ml = 34, mr = 10, mt = 12, mb = 22, iw = Wp-ml-mr, ih = Hp-mt-mb;
  const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]).concat(o.extraY||[]);
  const x0 = o.x0 != null ? o.x0 : Math.min(...xs), x1 = o.x1 != null ? o.x1 : Math.max(...xs);
  let y0 = Math.min(0, ...ys), y1 = Math.max(0, ...ys); if (y1 - y0 < 1e-6) y1 = y0 + 1; const yp = (y1-y0)*0.08; y1 += yp; if (y0 < 0) y0 -= yp;
  const X = v => ml + (x1===x0 ? 0 : (v-x0)/(x1-x0)*iw), Y = v => mt + ih - (v-y0)/(y1-y0)*ih;
  const nt = 4, ticks = Array.from({length:nt+1}, (_,i) => y0 + (y1-y0)*i/nt);
  let s = `<svg width="${Wp}" height="${Hp}" viewBox="0 0 ${Wp} ${Hp}" font-family="JetBrains Mono,monospace" font-size="10">`;
  ticks.forEach(v => { s += `<line x1="${ml}" x2="${Wp-mr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${ml-5}" y="${Y(v)+3}" text-anchor="end" fill="var(--tx3)">${Math.abs(y1-y0)>=8?Math.round(v):v.toFixed(1)}</text>`; });
  if (y0 < 0) s += `<line x1="${ml}" x2="${Wp-mr}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--tx3)" stroke-width="1"/>`;
  for (let i = 0; i <= 4; i++) { const v = x0 + (x1-x0)*i/4; s += `<text x="${X(v)}" y="${Hp-6}" text-anchor="${i===0?'start':i===4?'end':'middle'}" fill="var(--tx3)">${o.fmtX(v)}</text>`; }
  (o.refs||[]).forEach(r => { if (r.v == null || isNaN(r.v)) return; s += `<line x1="${ml}" x2="${Wp-mr}" y1="${Y(r.v)}" y2="${Y(r.v)}" stroke="${r.c}" stroke-width="1.2" stroke-dasharray="4 4"/><text x="${ml+6}" y="${Y(r.v)-4}" text-anchor="start" fill="${r.c}">${esc(r.l)}</text>`; });
  const d = pts.map((p,i) => (i?'L':'M') + X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join('');
  if (o.area) s += `<path d="${d}L${X(pts[pts.length-1][0]).toFixed(1)},${Y(Math.max(0,y0))}L${X(pts[0][0]).toFixed(1)},${Y(Math.max(0,y0))}Z" fill="${o.col}" fill-opacity=".12"/>`;
  s += `<path d="${d}" fill="none" stroke="${o.col}" stroke-width="2" stroke-linejoin="round"/>`;
  if (o.head) s += `<line id="${o.head}" x1="${ml}" x2="${ml}" y1="${mt}" y2="${mt+ih}" stroke="var(--acc)" stroke-width="1.5" style="display:none"/>`;
  (o.marks||[]).forEach(m => { s += `<g data-t="${m.t}" data-tip="${esc(m.tip)}" style="cursor:pointer"><line x1="${X(m.t)}" x2="${X(m.t)}" y1="${mt}" y2="${mt+ih}" stroke="${m.c}" stroke-opacity=".35" stroke-dasharray="2 3"/><circle cx="${X(m.t)}" cy="${Y(m.y)}" r="5.5" fill="${m.c}" stroke="#0b0d10" stroke-width="2"/></g>`; });
  el.innerHTML = s + '</svg>';
  return { X, ml, iw, x0, x1 };
}
function curveAt(t){ let v = 0; for (const p of rwCurve) { if (p[0] <= t) v = p[1]; else break; } return v; }
let rwGeo = null;
function drawRL(){
  const rc_ = document.getElementById('rwchart');
  if (rc_ && rwCurve.length) rwGeo = lineChart(rc_, rwCurve, { x0:0, x1:Math.max(duration, rwCurve[rwCurve.length-1][0]), col:'#2fb8ff', area:true, fmtX:fmtT, head:'rwhead',
    marks: rwEvents.map(e => ({ t:e.t, y:curveAt(e.t), c:EV_COL[e.term] || (e.value < 0 ? '#ff4d5e' : '#c28bff'), tip:`${fmtT(e.t)} · ${e.label||e.term} · ${sgn(e.value)}` })) });
  const lc = document.getElementById('rlchart');
  if (lc && rlCurve.length) lineChart(lc, rlCurve, { col:'#ffb020', h:150, fmtX:v => v >= 1000 ? (v/1000).toFixed(1)+'k' : Math.round(v),
    extraY:[RL.human_return, RL.learned_return].filter(v => v != null), refs:[{v:RL.human_return, c:WHO_COL.human, l:'you '+num(RL.human_return,1)}] });
  if (rwGeo) setRwHead(lastT);
}
let lastT = 0;
function setRwHead(t){ lastT = t; const h = document.getElementById('rwhead'); if (!h || !rwGeo) return; const x = rwGeo.X(Math.max(rwGeo.x0, Math.min(rwGeo.x1, t))); h.setAttribute('x1', x); h.setAttribute('x2', x); h.style.display = t > 0 ? '' : 'none'; }

// ---------- coach + footer
html += `<section class="sec card"><div class="sec-h"><span class="num">07</span><h2>Coach note</h2></div>
  <div class="coach">${D.coach?esc(D.coach):'<span class="dim">No coaching note generated for this run.</span>'}</div></section>`;
const cost = D.cost || {}; const costTot = Object.values(cost).reduce((a,v)=>a+(+v||0),0);
html += `<footer><span>Powered by VLM Run Gateway · SAM 3.1 · ViTPose+ · Qwen3.8</span>
  <span>${Object.keys(cost).length?'Cost $'+costTot.toFixed(4)+' ('+Object.entries(cost).map(([k,v])=>esc(k)+' $'+num(v,3)).join(', ')+')':''}${D.fps?' · '+num(D.fps,2)+' fps':''}${D.size?' · '+D.size.join('×'):''}</span></footer>`;

app.innerHTML = html;

// ---------- timeline ticks + interactions
const vid = document.getElementById('vid');
const ticks = document.getElementById('ticks');
const pct = t => Math.max(0, Math.min(100, (t / duration) * 100));
let th = '';
(J.events||[]).forEach(e => { if (e.t == null) return; const c = e.kind==='top'?'var(--ok)':e.kind==='zone'?'var(--warn)':'var(--acc)';
  th += `<div class="tick ev" style="left:${pct(e.t)}%;background:${c}" data-t="${e.t}" data-tip="${esc(fmtT(e.t)+' · '+e.label)}"></div>`; });
falls.forEach(f => { if (f.t_impact == null) return;
  th += `<div class="tick fall ${esc(f.kind)}" style="left:${pct(f.t_impact)}%" data-t="${Math.max(0,f.t_impact-0.8)}" data-tip="${esc(fmtT(f.t_impact)+' · '+(f.kind||'fall')+' #'+f.id+' · landing '+(f.landing_score!=null?f.landing_score:'—'))}"></div>`; });
places.forEach((p,i) => { if (p.t_on == null) return; const w = p.t_off!=null ? Math.max(0.4, pct(p.t_off)-pct(p.t_on)) : 0.5;
  th += `<div class="tick foot ${p.foot==='right'?'right':'left'}" style="left:${pct(p.t_on)+w/2}%;width:${w}%;background:${scoreCol(p.score)}" data-t="${p.t_on}" data-tip="${esc(fmtT(p.t_on)+' · '+p.foot+' foot → hold #'+p.hold+' · score '+p.score)}"></div>`; });
ticks.innerHTML = th;

function seek(t){ t = +t; if (isNaN(t)) return; if (vid) { try { vid.currentTime = Math.max(0,t); vid.play().catch(()=>{}); } catch(e){} vid.scrollIntoView({behavior:'smooth',block:'center'}); } setHead(t); }
const head = document.getElementById('head'), prog = document.getElementById('prog'), cur = document.getElementById('cur');
function setHead(t){ const p = pct(t); head.style.left = p + '%'; prog.style.width = p + '%'; cur.innerHTML = fmtT(t) + ' <small>/ ' + fmtT(duration) + '</small>'; setRwHead(t); }
setHead(0);
if (vid) {
  vid.addEventListener('loadedmetadata', () => { if (!D.frame_count && vid.duration) duration = vid.duration; });
  vid.addEventListener('timeupdate', () => setHead(vid.currentTime));
  vid.addEventListener('error', () => { vid.parentNode.innerHTML = '<div class="noasset">Video not found: ' + esc(D.video) + '</div>'; });
}
document.getElementById('tl').addEventListener('click', e => {
  const tk = e.target.closest('[data-t]'); if (tk) return seek(tk.dataset.t);
  const r = e.currentTarget.getBoundingClientRect(); seek(((e.clientX - r.left) / r.width) * duration);
});
document.querySelectorAll('.evlist li, .seek, tr.r').forEach(el => el.addEventListener('click', () => seek(el.dataset.t)));
function selectDyno(id, doSeek){
  const c = cands.find(x => x.id === id); if (!c) return;
  document.querySelectorAll('.dc').forEach(el => el.classList.toggle('sel', +el.dataset.cid === id));
  const sv = document.getElementById('dysvg'); if (sv) sv.innerHTML = dynoSvg(id);
  if (doSeek && c.t != null) seek(c.t);
}
if (cands.length) {
  selectDyno(cands[0].id, false);
  document.querySelectorAll('.dc').forEach(el => el.addEventListener('click', () => selectDyno(+el.dataset.cid, true)));
  document.getElementById('dymap').addEventListener('click', e => { const a = e.target.closest('.dy-arrow'); if (a) { selectDyno(+a.dataset.cid, false); const card = document.querySelector('.dc[data-cid="'+a.dataset.cid+'"]'); if (card) card.scrollIntoView({behavior:'smooth',block:'nearest'}); } });
}
// reward & rl interactions
drawRL();
let rlMode = 'both';
const rlsv = document.getElementById('rlsvg'); if (rlsv) rlsv.innerHTML = rlSvg(rlMode);
const rlseg = document.getElementById('rlseg');
if (rlseg) rlseg.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; rlMode = b.dataset.m;
  rlseg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); rlsv.innerHTML = rlSvg(rlMode); });
const rwc = document.getElementById('rwchart');
if (rwc) rwc.addEventListener('click', e => { const mk = e.target.closest('[data-t]'); if (mk) return seek(mk.dataset.t);
  if (!rwGeo) return; const svg = rwc.querySelector('svg'); const r = svg.getBoundingClientRect(); const px = (e.clientX - r.left) * (svg.viewBox.baseVal.width / r.width);
  const f = (px - rwGeo.ml) / rwGeo.iw; if (f < 0 || f > 1) return; seek(rwGeo.x0 + f * (rwGeo.x1 - rwGeo.x0)); });
let rsz; window.addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(drawRL, 120); });
document.addEventListener('mousemove', e => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (!el) { tip.style.display = 'none'; return; }
  tip.textContent = el.dataset.tip; tip.style.display = 'block';
  tip.style.left = Math.min(window.innerWidth - 270, e.clientX + 12) + 'px'; tip.style.top = (e.clientY + 14) + 'px';
});
})();
</script>
