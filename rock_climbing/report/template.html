<style>
:root{
  --bg:#0d0f12; --bg2:#14171c; --card:#171b21; --card2:#1d222a; --line:#272d36; --line2:#323a45;
  --tx:#e9edf2; --tx2:#9aa4b1; --tx3:#66707d;
  --acc:#2fb8ff; --acc2:#1f7fff; --accg:rgba(47,184,255,.14);
  --ok:#35d07f; --warn:#ffb020; --bad:#ff4d5e;
  --okg:rgba(53,208,127,.14); --warng:rgba(255,176,32,.14); --badg:rgba(255,77,94,.14);
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --sans:"Space Grotesk",system-ui,-apple-system,Segoe UI,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1200px 500px at 80% -10%,rgba(31,127,255,.12),transparent 60%),var(--bg)}
a{color:var(--acc)}
.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 48px}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx3)}
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:14px;padding:18px}
.sec{margin-top:22px}
.sec-h{display:flex;align-items:baseline;gap:12px;margin:0 0 12px}
.sec-h h2{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em}
.sec-h .num{font-family:var(--mono);font-size:12px;color:var(--acc);border:1px solid var(--line2);border-radius:6px;padding:2px 7px}
.muted{color:var(--tx2)} .dim{color:var(--tx3)}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
/* top bar */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.02em}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc)}
.live{font-family:var(--mono);font-size:11px;color:var(--tx2);border:1px solid var(--line2);padding:4px 9px;border-radius:99px}
/* hero */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;align-items:stretch}
.hero h1{font-size:44px;line-height:1;margin:8px 0 10px;letter-spacing:-.03em}
.route-chip{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:13px;background:var(--card2);border:1px solid var(--line2);border-radius:99px;padding:5px 12px}
.route-chip i{width:12px;height:12px;border-radius:50%;display:inline-block}
.badge{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;border-radius:14px;padding:18px 22px;margin-top:16px;border:1px solid}
.badge .res{font-size:64px;font-weight:700;letter-spacing:-.03em;line-height:.95}
.badge.top{background:var(--okg);border-color:rgba(53,208,127,.45)} .badge.top .res{color:var(--ok)}
.badge.zone{background:var(--warng);border-color:rgba(255,176,32,.45)} .badge.zone .res{color:var(--warn)}
.badge.none{background:var(--badg);border-color:rgba(255,77,94,.45)} .badge.none .res{color:var(--bad)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat .v{font-family:var(--mono);font-size:34px;font-weight:700;letter-spacing:-.02em;margin-top:6px}
.stat .v small{font-size:14px;color:var(--tx2);font-weight:400;margin-left:3px}
/* video */
.vid-grid{display:grid;grid-template-columns:1fr;gap:12px}
.video-box{background:#000;border-radius:12px;overflow:hidden;border:1px solid var(--line);position:relative}
.video-box video{display:block;width:100%;max-height:620px;background:#000}
.noasset{padding:60px 20px;text-align:center;color:var(--tx3);font-family:var(--mono);font-size:13px}
.readout{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0 8px}
.readout .t{font-family:var(--mono);font-size:26px;font-weight:700}
.readout .t small{color:var(--tx3);font-size:14px;font-weight:400}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--tx2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.tl{position:relative;height:104px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;cursor:pointer;user-select:none;overflow:hidden}
.tl .lane{position:absolute;left:0;right:0;height:1px;background:var(--line)}
.tl .lbl{position:absolute;left:8px;font-family:var(--mono);font-size:9px;color:var(--tx3);letter-spacing:.1em;pointer-events:none}
.tl .prog{position:absolute;top:0;bottom:0;left:0;background:var(--accg);pointer-events:none}
.tl .head{position:absolute;top:0;bottom:0;width:2px;background:var(--acc);box-shadow:0 0 8px var(--acc);pointer-events:none}
.tick{position:absolute;transform:translateX(-50%);border-radius:2px;cursor:pointer;transition:transform .12s}
.tick:hover{transform:translateX(-50%) scaleY(1.25)}
.tick.ev{width:4px;height:22px;top:6px}
.tick.fall{width:12px;height:12px;top:36px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 3px var(--badg)}
.tick.fall.jump_off,.tick.fall.downclimb{background:var(--warn);box-shadow:0 0 0 3px var(--warng)}
.tick.foot{height:12px;top:64px;min-width:3px;opacity:.9}
.tick.foot.right{top:84px}
.tl-axis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--tx3);margin-top:4px}
.tip{position:fixed;z-index:50;pointer-events:none;background:#0b0d10;border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:12px;max-width:260px;display:none}
/* judge */
.sm{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:stretch;gap:10px}
.node{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:16px;position:relative}
.node.done{border-color:rgba(53,208,127,.5);box-shadow:inset 0 0 0 1px rgba(53,208,127,.12)}
.node.miss{opacity:.55}
.node .nm{font-size:22px;font-weight:700;letter-spacing:.04em}
.node .ck{position:absolute;top:14px;right:14px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700}
.node.done .ck{background:var(--ok);color:#06220f}
.node.miss .ck{background:var(--line2);color:var(--tx3)}
.node .tm{font-family:var(--mono);font-size:24px;margin-top:10px}
.node .sub{font-size:12px;color:var(--tx2);margin-top:4px}
.arrow{align-self:center;color:var(--tx3);font-family:var(--mono);font-size:20px}
.evlist{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.evlist li{display:flex;gap:12px;align-items:baseline;font-size:13px;padding:8px 10px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);cursor:pointer}
.evlist li:hover{border-color:var(--acc)}
.evlist .mono{color:var(--acc);min-width:58px}
/* safety */
.saf-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:start}
.falls{display:grid;gap:14px}
.fall{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:auto 1fr;gap:16px}
.fall-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.kind{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:6px;border:1px solid}
.kind.fall{color:var(--bad);border-color:rgba(255,77,94,.5);background:var(--badg)}
.kind.jump_off{color:var(--acc);border-color:rgba(47,184,255,.5);background:var(--accg)}
.kind.downclimb{color:var(--ok);border-color:rgba(53,208,127,.5);background:var(--okg)}
.seek{font-family:var(--mono);font-size:12px;color:var(--tx2);background:none;border:1px solid var(--line2);border-radius:6px;padding:3px 8px;cursor:pointer}
.seek:hover{color:var(--acc);border-color:var(--acc)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.m{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.m .k{font-size:10px;color:var(--tx3);font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase}
.m .v{font-family:var(--mono);font-size:17px;font-weight:600;margin-top:3px}
.flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.flag{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--warng);color:var(--warn);border:1px solid rgba(255,176,32,.35)}
.flag.none{background:var(--okg);color:var(--ok);border-color:rgba(53,208,127,.35)}
.quote{margin:12px 0 0;padding:10px 14px;border-left:3px solid var(--acc);background:var(--bg2);border-radius:0 8px 8px 0;font-size:14px;line-height:1.5;color:var(--tx)}
.quote .src{display:block;font-family:var(--mono);font-size:10px;color:var(--tx3);margin-top:6px;letter-spacing:.08em}
.kf{margin-top:12px;border-radius:10px;overflow:hidden;border:1px solid var(--line);max-width:100%}
.kf img{display:block;width:100%;max-height:260px;object-fit:contain;background:#000}
.ring-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.clean{padding:34px 20px;text-align:center;border:1px dashed rgba(53,208,127,.45);border-radius:14px;background:var(--okg)}
.clean .big{font-size:28px;font-weight:700;color:var(--ok)}
.map-card{position:sticky;top:12px}
.map{position:relative;border-radius:10px;overflow:hidden;background:#07090b;border:1px solid var(--line)}
.map img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;opacity:.8}
.map svg{position:relative;display:block;width:100%;height:auto}
/* feet */
.feet-top{display:grid;grid-template-columns:auto 1fr 1fr;gap:14px;align-items:stretch}
.grade{display:flex;align-items:center;gap:16px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:16px 20px}
.grade .g{font-size:72px;font-weight:700;line-height:1;letter-spacing:-.04em}
.grade .s{font-family:var(--mono);font-size:28px;font-weight:700}
.pf{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.pf .row{display:flex;justify-content:space-between;font-size:13px;color:var(--tx2);margin-top:6px}
.pf .row b{font-family:var(--mono);color:var(--tx)}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:99px}
table.pl{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px}
.pl th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);font-weight:400;padding:8px;border-bottom:1px solid var(--line)}
.pl td{padding:9px 8px;border-bottom:1px solid var(--line);font-family:var(--mono)}
.pl tr.r{cursor:pointer}
.pl tr.r:hover td{background:var(--bg2)}
.pl tr.worst td{background:rgba(255,77,94,.06)}
.pl tr.worst td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.foot-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.scell{display:flex;align-items:center;gap:8px;min-width:120px}
.scell .bar{flex:1}
.tag-w{font-size:9px;color:var(--bad);border:1px solid rgba(255,77,94,.5);border-radius:4px;padding:1px 4px;margin-left:6px;letter-spacing:.08em}
.tbl-wrap{overflow-x:auto}
/* dyno */
.dy-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.dy-grid{display:grid;grid-template-columns:1fr 1.25fr;gap:18px;align-items:start}
.dy-list{display:grid;gap:10px}
.dc{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:12px;transition:border-color .15s}
.dc:hover{border-color:var(--line2)}
.dc.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 0 18px rgba(47,184,255,.15)}
.dc .ttl{font-family:var(--mono);font-size:15px;font-weight:700}
.dc .sub{font-size:12px;color:var(--tx2);margin-top:3px}
.need{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:6px;border:1px solid currentColor;white-space:nowrap}
.need.static{color:var(--ok);background:var(--okg)} .need.deadpoint{color:var(--acc);background:var(--accg)}
.need.dyno{color:var(--warn);background:var(--warng)} .need.out_of_reach{color:var(--bad);background:var(--badg)}
.dbar{display:grid;grid-template-columns:80px 1fr 72px;align-items:center;gap:8px;font-size:11px;font-family:var(--mono);color:var(--tx2);margin-top:8px}
.dbar .bar{position:relative}
.dbar .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--tx3)}
.dc .thumb{width:96px;height:96px;border-radius:8px;overflow:hidden;background:#000;border:1px solid var(--line)}
.dc .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.disagree{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.04em;color:var(--warn);background:var(--warng);border:1px solid rgba(255,176,32,.4);vertical-align:middle}
.vlm{margin-top:10px;font-size:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.vlm .q{flex-basis:100%;border-left:2px solid var(--acc);padding-left:10px;color:var(--tx);font-size:13px;line-height:1.45}
.dy-map-card{position:sticky;top:12px}
@media (max-width:900px){.dy-grid{grid-template-columns:1fr}.dy-map-card{position:static}}
@media (max-width:620px){.dy-stats{grid-template-columns:1fr 1fr}.dc{grid-template-columns:1fr}.dc .thumb{width:100%;height:160px}}
/* reward & rl */
.rw-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.rw-grid > div{min-width:0}
.chart{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:6px 6px 2px;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart.click{cursor:pointer}
.rw-total{display:flex;align-items:baseline;gap:10px;margin:16px 0 8px}
.rw-total .v{font-family:var(--mono);font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1}
.tb{display:grid;grid-template-columns:104px 1fr 58px;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--tx2);margin-top:5px}
.tb .trk{position:relative;height:12px;background:var(--bg2);border:1px solid var(--line);border-radius:4px}
.tb .trk .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--tx3)}
.tb .trk i{position:absolute;top:1px;bottom:1px;border-radius:3px}
.tb .w{color:var(--tx3);font-size:9px}
.rl-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.rl-stats .m .v{font-size:15px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;color:var(--tx2);font-family:var(--mono);font-size:12px;padding:5px 12px;cursor:pointer}
.seg button + button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--accg);color:var(--acc)}
.rl-map-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 8px}
@media (max-width:900px){.rw-grid{grid-template-columns:1fr}}
@media (max-width:620px){.rl-stats{grid-template-columns:1fr 1fr}.tb{grid-template-columns:92px 1fr 50px}.rw-total .v{font-size:36px}}
/* coach */
.coach{font-size:17px;line-height:1.6;border-left:3px solid var(--acc);padding:4px 0 4px 16px}
footer{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--tx3)}
@media (max-width:900px){
  .hero,.saf-grid{grid-template-columns:1fr}
  .map-card{position:static}
  .feet-top{grid-template-columns:1fr 1fr}
  .feet-top .grade{grid-column:1/-1}
}
@media (max-width:620px){
  .wrap{padding:16px 12px 36px}
  .hero h1{font-size:32px}
  .badge .res{font-size:48px}
  .stat .v{font-size:26px}
  .sm{grid-template-columns:1fr}
  .arrow{display:none}
  .fall{grid-template-columns:1fr}
  .metrics{grid-template-columns:repeat(2,1fr)}
  .feet-top{grid-template-columns:1fr}
  .pl .hide-sm{display:none}
}
</style>
</head>
<body>
<style>
/* "how is this computed?" affordance */
.info{display:inline-grid;place-items:center;width:17px;height:17px;margin-left:5px;padding:0;border-radius:50%;border:1px solid var(--line2);background:var(--bg2);color:var(--tx2);font:600 11px/1 var(--sans);cursor:pointer;vertical-align:middle;letter-spacing:0;text-transform:none;position:relative}
.info::after{content:"";position:absolute;inset:-7px}
.info:hover,.info:focus-visible,.info[aria-expanded="true"]{color:var(--acc);border-color:var(--acc);outline:none}
.pop{position:absolute;z-index:60;max-width:320px;background:#0b0d10;border:1px solid var(--acc);border-radius:10px;padding:10px 12px;font:400 12.5px/1.5 var(--sans);color:var(--tx);box-shadow:0 8px 28px rgba(0,0,0,.5);letter-spacing:0;text-transform:none}
.pop b{color:var(--acc);font-weight:600}
.pop[hidden]{display:none}
.opinion{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);border:1px dashed var(--line2);border-radius:4px;padding:1px 5px}
</style>
<div class="wrap" id="app"></div>
<div class="pop" id="pop" role="tooltip" hidden></div>
<div class="tip" id="tip"></div>
<script>
const DATA = /*__SAFETY_DATA__*/null;
(function(){
"use strict";
const D = DATA || {};
const app = document.getElementById('app');
const tip = document.getElementById('tip');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = (v, d=1) => (v == null || isNaN(v)) ? '—' : Number(v).toFixed(d);
const fmtT = t => { if (t == null || isNaN(t)) return '—'; const m = Math.floor(t/60), s = t - m*60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1); };
// silent-feet colours follow safety.silent_feet's grade bands: A>=90 B>=80 (green), C>=70 D>=60 (amber), E (red)
const scoreCol = s => s == null ? 'var(--tx3)' : s >= 80 ? 'var(--ok)' : s >= 60 ? 'var(--warn)' : 'var(--bad)';
// landing score has no bands in safety.falls; colour by how many issues it flagged (0 / 1 / 2+)
const flagCol = n => n == null ? 'var(--tx3)' : n === 0 ? 'var(--ok)' : n === 1 ? 'var(--warn)' : 'var(--bad)';
const COLORS = {blue:'#2f8bff',red:'#ff4d5e',green:'#35d07f',yellow:'#ffd23f',orange:'#ff8a3d',purple:'#a66bff',pink:'#ff6fb5',black:'#222',white:'#eee',gray:'#999',grey:'#999'};

if (!DATA) { app.innerHTML = '<div class="card sec"><div class="eyebrow">Climb Vision Judge</div><h2>No data</h2><p class="muted">This is the report template. Run <span class="mono">safety_report.py &lt;run_dir&gt;</span> to populate it.</p></div>'; return; }

const J = D.judge || {}, route = D.route || {}, falls = Array.isArray(D.falls) ? D.falls : [], feet = D.feet || {};
const places = Array.isArray(feet.placements) ? feet.placements : [];
const worst = new Set(Array.isArray(feet.worst) ? feet.worst : []);
const fps = D.fps || 30;
let duration = (D.frame_count && fps) ? D.frame_count / fps : 0;
const allT = [].concat((J.events||[]).map(e=>e.t), falls.map(f=>f.t_impact), places.map(p=>p.t_off||p.t_on));
if (!duration) duration = Math.max(1, ...allT.filter(x=>x!=null)) * 1.05;

const result = (J.result || 'NO SCORE').toUpperCase();
const badgeCls = result === 'TOP' ? 'top' : result === 'ZONE' ? 'zone' : 'none';
const timeOnWall = (J.start && J.start.t != null) ? ((J.top && J.top.reached && J.top.t != null) ? J.top.t - J.start.t : (falls[0] && falls[0].t_start != null ? falls[0].t_start - J.start.t : null)) : null;
const scored = falls.filter(f => f.landing_score != null);
const landingAvg = scored.length ? scored.reduce((a,f)=>a+f.landing_score,0)/scored.length : null;
const landingFlags = scored.length ? Math.max(...scored.map(f => (f.flags||[]).length)) : null;
const rc = COLORS[(route.color||'').toLowerCase()] || 'var(--acc)';

// ---------- "how is this computed?" text, mirroring the constants in src/safety.py, dyno.py, reward.py, rl.py
const BLpx = D.scale_px && D.scale_px.body ? ` Here 1 BL = ${num(D.scale_px.body,0)} px.` : '';
const BLdef = `BL = body-length, estimated from the pose as 1.35 × torso + thigh + shin (median over the clip).${BLpx}`;
const RWW = (D.reward && D.reward.weights) || {progress:10,zone:3,top:10,reach:-0.5,dyno_risk:-1,campus:-0.2,footwork:-0.1,fall:-10,landing:1,time:-0.01};
const RLd = D.rl || {}, FP = RLd.fail_p || {deadpoint:0.15, dyno:0.35};
const OPINION = 'This is a <b>model opinion</b> from a vision-language model on the gateway, reading one annotated frame. It is not a measurement and can be wrong.';
const INFO = {
  result: '<b>TOP</b>: both wrists on the top hold at once for ≥ 1.0 s with the hips still (median hip speed < 0.6 torso-lengths/s). If the top hold sits in the top 6% of the frame and the pipeline saw a top-out, control is taken from that route read instead. <b>ZONE</b>: a hand on the zone hold (60% of the way up the route by height) for ≥ 0.3 s. Otherwise <b>NO SCORE</b>.',
  attempts: 'Number of lift-offs: both toes clear of the floor edge (with 1.2% of frame-height clearance) for ≥ 0.5 s, with a hand on a route hold for ≥ 0.3 s. Lift-offs less than 0.3 s apart are merged. Never shown below 1.',
  time: 'Top time − start time. Start = first frame of the first lift-off. With no top, the end is the start of the first descent.',
  landing: 'Each descent starts at 100: −20 per knee straighter than 150°, a sliding 0 to −10 per knee between 120° and 150°, −20 per foot off the pad, −20 if a hand posts to the mat, −10 if the feet land more than 3 frames apart, −5 if the drop is > 1 BL and faster than 3 BL/s; +5 for a downclimb. Clamped 0–100. The colour is the number of issues flagged (0 green, 1 amber, 2+ red).',
  landingHero: 'Mean landing score over the descents in this clip (each scored from 100 with deductions for stiff knees, feet off the pad, posted hands, split feet and a high fast drop). With no descent detected there is nothing to score. Colour = most issues flagged on any one descent (0 green, 1 amber, 2+ red).',
  knee: 'Smallest hip–knee–ankle angle in the 0.35 s after touchdown (180° = straight leg). Above 150° = stiff (−20, red); 120–150° = partly bent (0 to −10, amber); 120° or less = good (green).',
  pad: 'Toe position (ankle + 2% of frame height) at the impact frame, tested against the crash-pad outline segmented by SAM, allowing 2.5% of frame height of tolerance at the edge. OFF costs −20.',
  hands: 'YES when a wrist is more than 0.25 torso-lengths below the hips and within 3% of frame height of the floor edge, from 3 frames before to 0.5 s after impact. Costs −20.',
  drop: 'Hip drop from the last frame a hand was on a hold (else the highest hip point in the 1.5 s before impact) down to impact. ' + BLdef,
  impact: 'Peak downward hip speed over the 3 frames before touchdown, in body-lengths per second (BL/s). ' + BLdef,
  feet: 'Mean of all foot-placement scores. Each placement = 100 − 15 × min(readjusts, 3) − min(25, 400 × jitter) − min(20, 12 × max(0, arrival speed − 0.5 BL/s)) − 20 × (1 − precision). Grades: A ≥ 90, B ≥ 80, C ≥ 70, D ≥ 60, else E.',
  readj: 'Re-placements on the same hold within 1 s, plus wiggles after a 0.2 s settle (each time toe speed rises above 0.8 shin-lengths/s). Each costs 15 points, up to 3.',
  jitter: 'Standard deviation of the toe position after the 0.2 s settle, in body-lengths (BL). Costs 400 × jitter points, at most 25.',
  precision: '1 − (distance from the first touch to the hold centre) ÷ (hold radius + 1 shin-length), clipped to 0–100%. Costs 20 × (1 − precision) points.',
  span: 'Longest reach while holding on: the larger of the widest hand-to-hand span actually held on this climb and 0.75 × wingspan, capped at 0.75 × 1.06 BL. Wingspan = 2 × arm length (90th percentile) + shoulder width, capped at 1.06 × body-length (ape index +6%). ' + BLdef,
  gain: 'Extra reach a dyno buys: flight height v²/2g with an assumed take-off speed of ' + num((D.dyno&&D.dyno.assumptions||{}).takeoff_speed_m_s||2.2,1) + ' m/s for an assumed ' + num((D.dyno&&D.dyno.assumptions||{}).height_m||1.75,2) + ' m climber, plus 0.35 × (thigh + shin) of leg drive. Per move only the upward share counts: gain × max(0.3, upward component). Assumed, not measured.',
  need: 'From the anchor hold: gap ≤ static span → <b>static</b>; ≤ static + 0.4 × gain → <b>deadpoint</b>; ≤ static + gain → <b>dyno</b>; beyond → <b>out of reach</b> (gain scaled by how upward the move is).',
  margin: 'Static span + direction-scaled dyno gain − gap, in BL. Positive = reach to spare; negative = short by that much. Bar full scale = static span + full gain.',
  gap: 'Centre-to-centre distance from the anchor hold to the target hold, in body-lengths (BL).',
  vlm: OPINION + ' The percentage is the model\'s <b>self-reported</b> confidence.',
  verdict: OPINION,
  coach: 'Written by a language model (qwen3.8-27b on the gateway) from the numbers in this report. It is <b>model opinion</b>; check its claims against the sections above.',
  total: 'Sum of every reward term below (weights shown as ×). Scored on the recorded climb by src/reward.py.',
  rlret: `Return of the learned greedy policy (no random failures) vs. your recorded hand sequence replayed in the same hands-only route model. Step reward = progress + zone + top + reach + dyno risk + ${RWW.time} × ${RLd.move_s||1.5} s per move. Feet and body position are not simulated.`,
  toprate: `Share of 200 runs of the greedy policy that topped, with random failure on deadpoints (${Math.round((FP.deadpoint||0)*100)}%) and dynos (${Math.round((FP.dyno||0)*100)}%), each × (1 − margin/gain). Tabular Q-learning, ${RLd.episodes||4000} episodes, α ${RLd.alpha!=null?RLd.alpha:0.2}, γ ${RLd.gamma!=null?RLd.gamma:0.97}, ε ${esc(RLd.epsilon||'1.0 → 0.05 over 80% of episodes')}, max ${RLd.max_steps||40} steps.`,
  cost: 'Gateway spend of this report stage only (pad segmentation + VLM calls incl. the coach note); gateway-reported where available, else estimated from token counts. The main pose/hold pipeline is not included.',
};
const TERM_INFO = {
  progress: `${RWW.progress} × rise in height of the higher hand's hold (0 = lowest route hold, 1 = top hold).`,
  zone: `${RWW.zone} once, the first time a hand is on the zone hold.`,
  top: `${RWW.top} for a controlled top (both hands on the top hold).`,
  reach: `${RWW.reach} × (gap ÷ static span)² per hand move, gap from the other hand's hold.`,
  dyno_risk: `${RWW.dyno_risk} × (1 − clip(margin ÷ dyno gain, 0, 1)) for deadpoint / dyno moves.`,
  campus: `${RWW.campus} per second hanging on a route hold with both feet visible and neither on a hold (spells ≥ 0.3 s).`,
  footwork: `${RWW.footwork} per silent-feet readjust.`,
  fall: `${RWW.fall} per uncontrolled fall (not jump-offs or downclimbs).`,
  landing: `${RWW.landing} × (landing score − 50) ÷ 50 per descent.`,
  time: `${RWW.time} per second on the wall (start to top).`,
};
let infoN = 0;
const ii = (key, html) => { const t = html != null ? html : INFO[key]; if (!t) return ''; infoN++;
  return `<button type="button" class="info" aria-label="How is this computed?" aria-expanded="false" aria-controls="pop" data-info="${esc(t)}">i</button>`; };

function ring(score, size=96, stroke=9, col){
  const r = (size-stroke)/2, c = 2*Math.PI*r, p = score == null ? 0 : Math.max(0,Math.min(100,score))/100;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-label="score ${score}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col||scoreCol(score)}" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${c*p} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle" fill="var(--tx)" font-family="JetBrains Mono,monospace" font-weight="700" font-size="${size*0.28}">${score==null?'—':Math.round(score)}</text>
  </svg>`;
}

let html = '';
// ---------- top bar + hero
html += `<div class="topbar"><div class="brand"><span class="dot"></span>CLIMB VISION JUDGE</div>
  <div class="live">${esc(D.generated_at ? 'Generated ' + String(D.generated_at).replace('T',' ') : 'Report')}</div></div>`;
html += `<section class="hero">
  <div class="card">
    <div class="eyebrow">Bouldering clip</div>
    <h1>${esc(D.clip || 'Untitled clip')}</h1>
    <span class="route-chip"><i style="background:${rc}"></i>${esc((route.color||'route').toUpperCase())} · ${esc(route.grade||'—')}${route.holds!=null?' · '+esc(route.holds)+' holds':''}</span>
    <div class="badge ${badgeCls}">
      <div class="eyebrow">Judge result${ii('result')}</div>
      <div class="res">${esc(result)}</div>
      <div class="muted" style="margin-top:6px;font-size:13px">${J.top&&J.top.reached?(J.top.controlled?(J.top.note?'Top reached · control inferred from the route read (top hold at the frame edge), not measured':'Controlled top · both hands held '+num(J.top.hold_s,1)+' s'):'Top touched, not held ≥ 1.0 s'):J.zone&&J.zone.reached?'Zone hold reached':J.start?'Started, zone not reached':'No lift-off detected'}</div>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><div class="eyebrow">Attempts${ii('attempts')}</div><div class="v">${J.attempts!=null?esc(J.attempts):'—'}</div></div>
    <div class="stat"><div class="eyebrow">Time on wall${ii('time')}</div><div class="v">${timeOnWall!=null?num(timeOnWall,1)+'<small>s</small>':'—'}</div></div>
    <div class="stat"><div class="eyebrow">Landing score${ii('landingHero')}</div><div class="v" style="color:${flagCol(landingFlags)}">${landingAvg!=null?Math.round(landingAvg):'—'}<small>${landingAvg!=null?'/100'+(scored.length>1?' · mean of '+scored.length:''):'no descent detected'}</small></div></div>
    <div class="stat"><div class="eyebrow">Silent feet${ii('feet')}</div><div class="v" style="color:${scoreCol(feet.score)}">${esc(feet.grade||'—')}<small>${feet.score!=null?Math.round(feet.score)+'/100':''}</small></div></div>
  </div>
</section>`;

// ---------- footage warnings
if ((DATA.warnings || []).length) {
  html += `<section class="sec card" style="border-color:#e0a13a66">
    <div class="sec-h"><h2 style="color:#e0a13a">Read with care</h2></div>
    ${DATA.warnings.map(w => `<p class="dim" style="margin:6px 0">⚠ ${String(w).replace(/[<>&]/g, c => ({"<": "&lt;", ">": "&gt;", "&": "&amp;"})[c])}</p>`).join("")}
  </section>`;
}

// ---------- video + timeline
html += `<section class="sec card">
  <div class="sec-h"><span class="num">01</span><h2>Replay</h2></div>
  <div class="video-box">${D.video ? `<video id="vid" src="${esc(D.video)}" controls playsinline preload="metadata"></video>` : '<div class="noasset">No video in this run</div>'}</div>
  <div class="readout"><div class="t mono" id="cur">0:00.0 <small>/ ${fmtT(duration)}</small></div>
    <div class="legend"><span><i style="background:var(--acc)"></i>Judge</span><span><i style="background:var(--bad);border-radius:50%"></i>Fall</span><span><i style="background:var(--ok)"></i>Foot A–B (≥80)</span><span><i style="background:var(--warn)"></i>Foot C–D (60–79)</span><span><i style="background:var(--bad)"></i>Foot E (&lt;60)</span></div></div>
  <div class="tl" id="tl">
    <div class="prog" id="prog"></div>
    <div class="lane" style="top:31px"></div><div class="lane" style="top:58px"></div>
    <span class="lbl" style="top:20px">JUDGE</span><span class="lbl" style="top:47px">FALLS</span><span class="lbl" style="top:66px">L FOOT</span><span class="lbl" style="top:86px">R FOOT</span>
    <div id="ticks"></div>
    <div class="head" id="head"></div>
  </div>
  <div class="tl-axis"><span>0:00</span><span>${fmtT(duration/4)}</span><span>${fmtT(duration/2)}</span><span>${fmtT(duration*3/4)}</span><span>${fmtT(duration)}</span></div>
</section>`;

// ---------- judge scorecard
const st = J.start || {}, zn = J.zone || {}, tp = J.top || {};
const startOk = st.t != null;
// the judge's own event labels say "controlled"; state what was actually measured
const evLabel = e => String(e.label||'').replace('controlled touch on', 'hand on').replace(/(Zone: hand on hold #\d+)/, '$1 for ≥ 0.3 s')
  .replace(' — controlled', tp.note ? ' — control inferred from route read' : ' — held ≥ 1.0 s');
(J.events||[]).forEach(e => { e.label = evLabel(e); });
html += `<section class="sec card">
  <div class="sec-h"><span class="num">02</span><h2>Judge scorecard</h2><span class="dim" style="font-size:13px">IFSC-style state machine</span></div>
  <div class="sm">
    <div class="node ${startOk?'done':'miss'}"><div class="ck">${startOk?'✓':'–'}</div><div class="eyebrow">State 1</div><div class="nm">START</div>
      <div class="tm">${startOk?fmtT(st.t):'—'}</div><div class="sub">${st.holds&&st.holds.length?'Holds '+st.holds.map(esc).join(' + '):'Start holds'}${st.frame!=null?' · frame '+esc(st.frame):''}</div></div>
    <div class="arrow">→</div>
    <div class="node ${zn.reached?'done':'miss'}"><div class="ck">${zn.reached?'✓':'–'}</div><div class="eyebrow">State 2</div><div class="nm">ZONE</div>
      <div class="tm">${zn.reached?fmtT(zn.t):'—'}</div><div class="sub">${zn.hold!=null?'Hold #'+esc(zn.hold):'Zone hold'}${zn.reached&&startOk&&zn.t!=null?' · +'+num(zn.t-st.t,1)+'s':''}</div></div>
    <div class="arrow">→</div>
    <div class="node ${tp.reached?'done':'miss'}"><div class="ck">${tp.reached?'✓':'–'}</div><div class="eyebrow">State 3</div><div class="nm">TOP</div>
      <div class="tm">${tp.reached?fmtT(tp.t):'—'}</div><div class="sub">${tp.hold!=null?'Hold #'+esc(tp.hold):'Top hold'}${tp.reached?(tp.controlled?(tp.note?' · <span class="warn">control inferred</span> <span class="dim">(both hands seen '+num(tp.hold_s,1)+' s of the 1.0 s needed; top hold at frame edge, so the route read\'s top-out is used)</span>':' · <span class="ok">held '+num(tp.hold_s,1)+' s ≥ 1.0 s</span>'):' · <span class="warn">held '+num(tp.hold_s,1)+' s, needs ≥ 1.0 s still</span>'):''}${ii('result')}</div></div>
  </div>
  ${(J.events||[]).length?`<ul class="evlist">${J.events.map(e=>`<li data-t="${e.t}"><span class="mono">${fmtT(e.t)}</span><span>${esc(e.label)}</span></li>`).join('')}</ul>`:''}
</section>`;

// ---------- landing safety
const pad = D.pad || null;
function fallCard(f){
  const fp = Array.isArray(f.feet_on_pad) ? f.feet_on_pad : null;
  const fpTxt = v => v == null ? '—' : v ? '<span class="ok">ON</span>' : '<span class="bad">OFF</span>';
  const ka = f.knee_angle_min || {};
  const kCol = a => a == null ? '' : a > 150 ? 'bad' : a > 120 ? 'warn' : 'ok';   // safety.STIFF_KNEE / GOOD_KNEE
  const flags = Array.isArray(f.flags) ? f.flags : [];
  return `<div class="fall">
    <div class="ring-wrap">${ring(f.landing_score, 96, 9, flagCol(flags.length))}<div class="eyebrow">Landing${ii('landing')}</div></div>
    <div>
      <div class="fall-h"><span class="kind ${esc(f.kind)}">${esc((f.kind||'fall').replace('_',' '))}</span><strong>#${esc(f.id)}</strong>
        <button class="seek" data-t="${f.t_impact!=null?f.t_impact-0.8:f.t_start}">▶ ${fmtT(f.t_impact)}</button></div>
      <div class="metrics">
        <div class="m"><div class="k">Knee L${ii('knee')}</div><div class="v ${kCol(ka.left)}">${num(ka.left,0)}°</div></div>
        <div class="m"><div class="k">Knee R${ii('knee')}</div><div class="v ${kCol(ka.right)}">${num(ka.right,0)}°</div></div>
        <div class="m"><div class="k">Feet on pad${ii('pad')}</div><div class="v">${fp?fpTxt(fp[0])+' / '+fpTxt(fp[1]):'<span class="dim">no pad</span>'}</div></div>
        <div class="m"><div class="k">Hands posted${ii('hands')}</div><div class="v ${f.hands_posted?'bad':'ok'}">${f.hands_posted==null?'—':f.hands_posted?'YES':'NO'}</div></div>
        <div class="m"><div class="k">Drop${ii('drop')}</div><div class="v">${num(f.drop_body_lengths,2)}<span class="dim" style="font-size:11px"> BL</span></div></div>
        <div class="m"><div class="k">Impact${ii('impact')}</div><div class="v">${num(f.impact_speed_bl_s,1)}<span class="dim" style="font-size:11px"> BL/s</span></div></div>
      </div>
      ${f.feet_sync_ms!=null?`<div class="dim" style="font-size:12px;margin-top:8px">Feet touched down ${esc(f.feet_sync_ms)} ms apart (flagged above ${Math.round(3000/fps)} ms = 3 frames)</div>`:''}
      <div class="flags">${flags.length?flags.map(x=>`<span class="flag">${esc(x)}</span>`).join(''):'<span class="flag none">No issues flagged</span>'}</div>
      ${f.verdict?`<blockquote class="quote">“${esc(f.verdict)}”<span class="src">MODEL OPINION · VLM ON THE GATEWAY · NOT A MEASUREMENT${ii('verdict')}${f.vlm&&f.vlm.agrees_with_metrics===false?' <span class="disagree">VLM disagrees with metrics</span>':''}</span></blockquote>`:''}
      ${f.keyframe?`<div class="kf"><img src="${esc(f.keyframe)}" alt="Impact keyframe" loading="lazy" onerror="this.parentNode.style.display='none'"></div>`:''}
    </div></div>`;
}
const W = (D.size && D.size[0]) || 1, H = (D.size && D.size[1]) || 1, AR = H / W;
function mapSvg(){
  const P = (pt) => `${(pt[0]).toFixed(4)},${(pt[1]*AR).toFixed(4)}`;
  let s = `<svg viewBox="0 0 1 ${AR.toFixed(4)}" preserveAspectRatio="none">`;
  const polys = (pad && Array.isArray(pad.polygons)) ? pad.polygons : [];
  polys.forEach(pg => { if (pg && pg.length > 2) s += `<polygon points="${pg.map(P).join(' ')}" fill="rgba(53,208,127,.28)" stroke="#35d07f" stroke-width="0.004" stroke-dasharray="0.012 0.008"/>`; });
  (D.holds||[]).forEach(h => {
    if (h.polygon && h.polygon.length > 2) s += `<polygon points="${h.polygon.map(P).join(' ')}" fill="rgba(47,184,255,.12)" stroke="rgba(47,184,255,.6)" stroke-width="0.002"/>`;
    if (h.centroid_xy) { const [x,y] = h.centroid_xy; s += `<circle cx="${x}" cy="${y*AR}" r="0.009" fill="${rc}" stroke="#fff" stroke-width="0.002"/><text x="${x+0.014}" y="${y*AR+0.006}" font-size="0.022" fill="#cfe8ff" font-family="JetBrains Mono,monospace">${esc(h.id)}</text>`; }
  });
  falls.forEach(f => {
    const ax = Array.isArray(f.ankle_xy) ? f.ankle_xy : [];
    const fp = Array.isArray(f.feet_on_pad) ? f.feet_on_pad : [];
    const pts = ax.filter(Boolean);
    if (pts.length === 2) s += `<line x1="${pts[0][0]}" y1="${pts[0][1]*AR}" x2="${pts[1][0]}" y2="${pts[1][1]*AR}" stroke="rgba(255,255,255,.5)" stroke-width="0.003"/>`;
    ax.forEach((a,i) => { if (!a) return; const on = fp[i]; const c = on == null ? '#9aa4b1' : on ? '#35d07f' : '#ff4d5e';
      s += `<circle cx="${a[0]}" cy="${a[1]*AR}" r="0.026" fill="${c}" fill-opacity=".25" stroke="${c}" stroke-width="0.004"/><circle cx="${a[0]}" cy="${a[1]*AR}" r="0.009" fill="${c}"/>
      <text x="${a[0]}" y="${a[1]*AR-0.036}" text-anchor="middle" font-size="0.024" font-weight="700" fill="#fff" font-family="JetBrains Mono,monospace">${esc(f.id)}${i?'R':'L'}</text>`; });
  });
  return s + '</svg>';
}
html += `<section class="sec card">

        labels += `<g data-tip="${esc(tipTxt)}"><circle cx="${x2+r}" cy="${y2*AR-r}" r="0.016" fill="#0b0d10" stroke="${col}" stroke-width="0.003"/><text x="${x2+r}" y="${y2*AR-r+0.0065}" text-anchor="middle" font-size="0.018" font-weight="700" fill="${col}" font-family="JetBrains Mono,monospace">${n}</text></g>`;
        return;
      }
      const [x1,y1] = a.centroid_xy; const X1 = x1, Y1 = y1*AR, X2 = x2, Y2 = y2*AR;
      const L = Math.hypot(X2-X1, Y2-Y1) || 1, ux = (X2-X1)/L, uy = (Y2-Y1)/L, nx = -uy*off, ny = ux*off, sh = 0.016;
      const k = NEED_DASH[m.needed] != null ? m.needed : 'dyno', dash = NEED_DASH[k];
      s += `<line x1="${X1+ux*sh+nx}" y1="${Y1+uy*sh+ny}" x2="${X2-ux*sh+nx}" y2="${Y2-uy*sh+ny}" stroke="${col}" stroke-width="0.005" stroke-opacity=".9" ${dash?`stroke-dasharray="${dash}"`:''} stroke-linecap="round" marker-end="url(#rl-ah-${who})" data-tip="${esc(tipTxt)}"/>`;
      const key = m.from + '-' + m.to; seen[key] = (seen[key] || 0) + 1;
      const f = 0.5 + (seen[key]-1)*0.16 * (who === 'human' ? 1 : -1), lx = X1+(X2-X1)*f+nx*2.2, ly = Y1+(Y2-Y1)*f+ny*2.2;
      labels += `<g data-tip="${esc(tipTxt)}"><circle cx="${lx}" cy="${ly}" r="0.016" fill="#0b0d10" stroke="${col}" stroke-width="0.003"/><text x="${lx}" y="${ly+0.0065}" text-anchor="middle" font-size="0.018" font-weight="700" fill="${col}" font-family="JetBrains Mono,monospace">${n}</text></g>`;
    });
  });
  return s + labels + '</svg>';
}
// pixel-sized line chart (re-rendered on resize so text stays legible on phones)
function lineChart(el, pts, o){
  const Wp = Math.max(260, el.clientWidth - 12), Hp = o.h || Math.round(Math.max(150, Math.min(220, Wp*0.42)));
  const ml = 34, mr = 10, mt = 12, mb = 22, iw = Wp-ml-mr, ih = Hp-mt-mb;
  const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]).concat(o.extraY||[]);
  const x0 = o.x0 != null ? o.x0 : Math.min(...xs), x1 = o.x1 != null ? o.x1 : Math.max(...xs);
  let y0 = Math.min(0, ...ys), y1 = Math.max(0, ...ys); if (y1 - y0 < 1e-6) y1 = y0 + 1; const yp = (y1-y0)*0.08; y1 += yp; if (y0 < 0) y0 -= yp;
  const X = v => ml + (x1===x0 ? 0 : (v-x0)/(x1-x0)*iw), Y = v => mt + ih - (v-y0)/(y1-y0)*ih;
  const nt = 4, ticks = Array.from({length:nt+1}, (_,i) => y0 + (y1-y0)*i/nt);
  let s = `<svg width="${Wp}" height="${Hp}" viewBox="0 0 ${Wp} ${Hp}" font-family="JetBrains Mono,monospace" font-size="10">`;
  ticks.forEach(v => { s += `<line x1="${ml}" x2="${Wp-mr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${ml-5}" y="${Y(v)+3}" text-anchor="end" fill="var(--tx3)">${Math.abs(y1-y0)>=8?Math.round(v):v.toFixed(1)}</text>`; });
  if (y0 < 0) s += `<line x1="${ml}" x2="${Wp-mr}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--tx3)" stroke-width="1"/>`;
  for (let i = 0; i <= 4; i++) { const v = x0 + (x1-x0)*i/4; s += `<text x="${X(v)}" y="${Hp-6}" text-anchor="${i===0?'start':i===4?'end':'middle'}" fill="var(--tx3)">${o.fmtX(v)}</text>`; }
  (o.refs||[]).forEach(r => { if (r.v == null || isNaN(r.v)) return; s += `<line x1="${ml}" x2="${Wp-mr}" y1="${Y(r.v)}" y2="${Y(r.v)}" stroke="${r.c}" stroke-width="1.2" stroke-dasharray="4 4"/><text x="${ml+6}" y="${Y(r.v)-4}" text-anchor="start" fill="${r.c}">${esc(r.l)}</text>`; });
  const d = pts.map((p,i) => (i?'L':'M') + X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join('');
  if (o.area) s += `<path d="${d}L${X(pts[pts.length-1][0]).toFixed(1)},${Y(Math.max(0,y0))}L${X(pts[0][0]).toFixed(1)},${Y(Math.max(0,y0))}Z" fill="${o.col}" fill-opacity=".12"/>`;
  s += `<path d="${d}" fill="none" stroke="${o.col}" stroke-width="2" stroke-linejoin="round"/>`;
  if (o.head) s += `<line id="${o.head}" x1="${ml}" x2="${ml}" y1="${mt}" y2="${mt+ih}" stroke="var(--acc)" stroke-width="1.5" style="display:none"/>`;
  (o.marks||[]).forEach(m => { s += `<g data-t="${m.t}" data-tip="${esc(m.tip)}" style="cursor:pointer"><line x1="${X(m.t)}" x2="${X(m.t)}" y1="${mt}" y2="${mt+ih}" stroke="${m.c}" stroke-opacity=".35" stroke-dasharray="2 3"/><circle cx="${X(m.t)}" cy="${Y(m.y)}" r="5.5" fill="${m.c}" stroke="#0b0d10" stroke-width="2"/></g>`; });
  el.innerHTML = s + '</svg>';
  return { X, ml, iw, x0, x1 };
}
function curveAt(t){ let v = 0; for (const p of rwCurve) { if (p[0] <= t) v = p[1]; else break; } return v; }
let rwGeo = null;
function drawRL(){
  const rc_ = document.getElementById('rwchart');
  if (rc_ && rwCurve.length) rwGeo = lineChart(rc_, rwCurve, { x0:0, x1:Math.max(duration, rwCurve[rwCurve.length-1][0]), col:'#2fb8ff', area:true, fmtX:fmtT, head:'rwhead',
    marks: rwEvents.map(e => ({ t:e.t, y:curveAt(e.t), c:EV_COL[e.term] || (e.value < 0 ? '#ff4d5e' : '#c28bff'), tip:`${fmtT(e.t)} · ${e.label||e.term} · ${sgn(e.value)}` })) });
  const lc = document.getElementById('rlchart');
  if (lc && rlCurve.length) lineChart(lc, rlCurve, { col:'#ffb020', h:150, fmtX:v => v >= 1000 ? (v/1000).toFixed(1)+'k' : Math.round(v),
    extraY:[RL.human_return, RL.learned_return].filter(v => v != null), refs:[{v:RL.human_return, c:WHO_COL.human, l:'you '+num(RL.human_return,1)}] });
  if (rwGeo) setRwHead(lastT);
}
let lastT = 0;
function setRwHead(t){ lastT = t; const h = document.getElementById('rwhead'); if (!h || !rwGeo) return; const x = rwGeo.X(Math.max(rwGeo.x0, Math.min(rwGeo.x1, t))); h.setAttribute('x1', x); h.setAttribute('x2', x); h.style.display = t > 0 ? '' : 'none'; }

// ---------- coach + footer
html += `<section class="sec card"><div class="sec-h"><span class="num">07</span><h2>Coach note</h2></div>
  ${D.coach?`<div style="margin:-4px 0 10px"><span class="opinion">model opinion · written by an LLM</span>${ii('coach')}</div>`:''}
  <div class="coach">${D.coach?esc(D.coach):'<span class="dim">No coaching note generated for this run.</span>'}</div></section>`;
const cost = D.cost || {}; const costTot = Object.values(cost).reduce((a,v)=>a+(+v||0),0);
html += `<footer><span>Powered by VLM Run Gateway · SAM 3.1 · ViTPose+ · Qwen3.8</span>
  <span>${Object.keys(cost).length?'Report-stage gateway cost $'+costTot.toFixed(4)+' ('+Object.entries(cost).map(([k,v])=>esc(k.replace(/_/g,' '))+' $'+num(v,4)).join(', ')+')'+ii('cost'):''}${D.fps?' · '+num(D.fps,2)+' fps':''}${D.size?' · '+D.size.join('×'):''}</span></footer>`;

app.innerHTML = html;

// ---------- timeline ticks + interactions
const vid = document.getElementById('vid');
const ticks = document.getElementById('ticks');
const pct = t => Math.max(0, Math.min(100, (t / duration) * 100));
let th = '';
(J.events||[]).forEach(e => { if (e.t == null) return; const c = e.kind==='top'?'var(--ok)':e.kind==='zone'?'var(--warn)':'var(--acc)';
  th += `<div class="tick ev" style="left:${pct(e.t)}%;background:${c}" data-t="${e.t}" data-tip="${esc(fmtT(e.t)+' · '+e.label)}"></div>`; });
falls.forEach(f => { if (f.t_impact == null) return;
  th += `<div class="tick fall ${esc(f.kind)}" style="left:${pct(f.t_impact)}%" data-t="${Math.max(0,f.t_impact-0.8)}" data-tip="${esc(fmtT(f.t_impact)+' · '+(f.kind||'fall')+' #'+f.id+' · landing '+(f.landing_score!=null?f.landing_score:'—'))}"></div>`; });
places.forEach((p,i) => { if (p.t_on == null) return; const w = p.t_off!=null ? Math.max(0.4, pct(p.t_off)-pct(p.t_on)) : 0.5;
  th += `<div class="tick foot ${p.foot==='right'?'right':'left'}" style="left:${pct(p.t_on)+w/2}%;width:${w}%;background:${scoreCol(p.score)}" data-t="${p.t_on}" data-tip="${esc(fmtT(p.t_on)+' · '+p.foot+' foot → hold #'+p.hold+' · score '+p.score)}"></div>`; });
ticks.innerHTML = th;

function seek(t){ t = +t; if (isNaN(t)) return; if (vid) { try { vid.currentTime = Math.max(0,t); vid.play().catch(()=>{}); } catch(e){} vid.scrollIntoView({behavior:'smooth',block:'center'}); } setHead(t); }
const head = document.getElementById('head'), prog = document.getElementById('prog'), cur = document.getElementById('cur');
function setHead(t){ const p = pct(t); head.style.left = p + '%'; prog.style.width = p + '%'; cur.innerHTML = fmtT(t) + ' <small>/ ' + fmtT(duration) + '</small>'; setRwHead(t); }
setHead(0);
if (vid) {
  vid.addEventListener('loadedmetadata', () => { if (!D.frame_count && vid.duration) duration = vid.duration; });
  vid.addEventListener('timeupdate', () => setHead(vid.currentTime));
  vid.addEventListener('error', () => { vid.parentNode.innerHTML = '<div class="noasset">Video not found: ' + esc(D.video) + '</div>'; });
}
document.getElementById('tl').addEventListener('click', e => {
  const tk = e.target.closest('[data-t]'); if (tk) return seek(tk.dataset.t);
  const r = e.currentTarget.getBoundingClientRect(); seek(((e.clientX - r.left) / r.width) * duration);
});
document.querySelectorAll('.evlist li, .seek, tr.r').forEach(el => el.addEventListener('click', () => seek(el.dataset.t)));
function selectDyno(id, doSeek){
  const c = cands.find(x => x.id === id); if (!c) return;
  document.querySelectorAll('.dc').forEach(el => el.classList.toggle('sel', +el.dataset.cid === id));
  const sv = document.getElementById('dysvg'); if (sv) sv.innerHTML = dynoSvg(id);
  if (doSeek && c.t != null) seek(c.t);
}
if (cands.length) {
  selectDyno(cands[0].id, false);
  document.querySelectorAll('.dc').forEach(el => el.addEventListener('click', () => selectDyno(+el.dataset.cid, true)));
  document.getElementById('dymap').addEventListener('click', e => { const a = e.target.closest('.dy-arrow'); if (a) { selectDyno(+a.dataset.cid, false); const card = document.querySelector('.dc[data-cid="'+a.dataset.cid+'"]'); if (card) card.scrollIntoView({behavior:'smooth',block:'nearest'}); } });
}
// reward & rl interactions
drawRL();
let rlMode = 'both';
const rlsv = document.getElementById('rlsvg'); if (rlsv) rlsv.innerHTML = rlSvg(rlMode);
const rlseg = document.getElementById('rlseg');
if (rlseg) rlseg.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; rlMode = b.dataset.m;
  rlseg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); rlsv.innerHTML = rlSvg(rlMode); });
const rwc = document.getElementById('rwchart');
if (rwc) rwc.addEventListener('click', e => { const mk = e.target.closest('[data-t]'); if (mk) return seek(mk.dataset.t);
  if (!rwGeo) return; const svg = rwc.querySelector('svg'); const r = svg.getBoundingClientRect(); const px = (e.clientX - r.left) * (svg.viewBox.baseVal.width / r.width);
  const f = (px - rwGeo.ml) / rwGeo.iw; if (f < 0 || f > 1) return; seek(rwGeo.x0 + f * (rwGeo.x1 - rwGeo.x0)); });
let rsz; window.addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(drawRL, 120); });
// ---------- ⓘ popovers: click/tap toggles (pinned), hover and keyboard focus preview, Esc / outside click closes
const pop = document.getElementById('pop');
let popFor = null, pinned = false;
function showPop(btn, pin){
  if (popFor && popFor !== btn) popFor.setAttribute('aria-expanded', 'false');
  pop.innerHTML = btn.dataset.info; pop.hidden = false; popFor = btn; pinned = !!pin;
  btn.setAttribute('aria-expanded', 'true'); btn.setAttribute('aria-describedby', 'pop');
  const r = btn.getBoundingClientRect(), w = Math.min(320, window.innerWidth - 24);
  pop.style.maxWidth = w + 'px';
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  const x = Math.max(12, Math.min(window.innerWidth - pw - 12, r.left + r.width/2 - pw/2));
  const below = r.bottom + 8 + ph < window.innerHeight || r.top < ph + 16;
  pop.style.left = (x + window.scrollX) + 'px';
  pop.style.top = ((below ? r.bottom + 8 : r.top - ph - 8) + window.scrollY) + 'px';
}
function hidePop(){ if (popFor) { popFor.setAttribute('aria-expanded', 'false'); popFor.removeAttribute('aria-describedby'); } pop.hidden = true; popFor = null; pinned = false; }
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('.info');
  if (b) { e.stopPropagation(); e.preventDefault(); if (popFor === b && pinned) hidePop(); else showPop(b, true); return; }
  if (!pop.hidden && !pop.contains(e.target)) hidePop();
}, true);   // capture: an ⓘ inside a clickable card must not also seek the video / select the card
const finePointer = window.matchMedia && window.matchMedia('(hover:hover) and (pointer:fine)').matches;
if (finePointer) {
  document.addEventListener('mouseover', e => { const b = e.target.closest && e.target.closest('.info'); if (b && !pinned) showPop(b, false); });
  document.addEventListener('mouseout', e => { const b = e.target.closest && e.target.closest('.info'); if (b && !pinned && popFor === b) hidePop(); });
}
document.addEventListener('focusin', e => { if (e.target.classList && e.target.classList.contains('info') && !pinned) showPop(e.target, false); });
document.addEventListener('focusout', e => { if (e.target === popFor && !pinned) hidePop(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !pop.hidden) hidePop(); });
window.addEventListener('scroll', () => { if (!pop.hidden && !pinned) hidePop(); }, {passive:true});
document.addEventListener('mousemove', e => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (!el) { tip.style.display = 'none'; return; }
  tip.textContent = el.dataset.tip; tip.style.display = 'block';
  tip.style.left = Math.min(window.innerWidth - 270, e.clientX + 12) + 'px'; tip.style.top = (e.clientY + 14) + 'px';
});
})();
